<script>
// Documents attached to each experience (put the files in assets/projects/).
// Example: x1: [['polestar-report.pdf', 'doc.report'], ['polestar-ratios.xlsx', 'doc.excel']]
// Labels available: doc.report, doc.slides, doc.excel, doc.model, doc.log, doc.paper, doc.market, doc.code, doc.cert
var PROJECT_FILES = {
  x1: [['polestar-report.pdf', 'doc.report'], ['polestar-presentation.pdf', 'doc.slides'], ['polestar-model.xlsx', 'doc.model'], ['polestar-decision-log.pdf', 'doc.log']],
  x2: [['investment-report.pdf', 'doc.report'], ['investment-model.xlsx', 'doc.model']],
  x3: [['autolyzer-alignment-model.xlsx', 'doc.model'], ['autolyzer-norwegian-market.pdf', 'doc.market']],
  x4: [['leadership-paper.pdf', 'doc.paper']],
  x5: []
};
// Build the experience list from the translation keys x1, x2, ... (stops at the first missing one)
(function () {
  var html = '', en = window.I18N.en;
  for (var i = 1; en['x' + i + '.t']; i++) {
    var k = 'x' + i, files = PROJECT_FILES[k] || [];
    html += '<div class="xp reveal"><div><div class="when" data-i18n="' + k + '.when"></div>' +
      '<div class="where" data-i18n="' + k + '.where"></div></div><div>' +
      '<h3 data-i18n="' + k + '.t"></h3><p data-i18n="' + k + '.p"></p>' +
      '<div class="link" data-i18n="' + k + '.l"></div>' +
      (en[k + '.tags'] ? '<div class="tags" data-tags="' + k + '.tags"></div>' : '') +
      (files.length ? '<div class="sites">' + files.map(function (f) {
        return '<a href="../assets/projects/' + f[0] + '" target="_blank" rel="noopener" data-i18n="' + f[1] + '"></a>';
      }).join('') + '</div>' : '') +
      '</div></div>';
  }
  document.getElementById('xp-list').innerHTML = html;
})();
</script>
